<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1b1b1b">
  <rect width="1500" height="900" fill="#ffffff"/>
  <style>
    .mod{fill:#eef3f8;stroke:#44546a;stroke-width:1.5}
    .pwr{fill:#fdf1e3;stroke:#8a5a1c;stroke-width:1.5}
    .ph{fill:#f1ede4;stroke:#6b5b3a;stroke-width:1.5}
    .extra{fill:#fffbe0;stroke:#9a8400;stroke-width:1.2;stroke-dasharray:5 3}
    .t{font-weight:bold;font-size:14px;text-anchor:middle}
    .s{font-size:11px;text-anchor:middle;fill:#444}
    .c{text-anchor:middle}
    .e{text-anchor:end}
    .w{fill:none;stroke-width:2.5;stroke-linejoin:round}
    .v5{stroke:#d62828}.gnd{stroke:#1b1b1b}.sig{stroke:#1d6fb8}.ring{stroke:#e07b00}.aud{stroke:#2a9d4b}
    .thick{stroke-width:5}
    .pad{fill:#c9a227;stroke:#6b5400;stroke-width:1}
    .cap{fill:#3b4a5a}
  </style>

  <text x="40" y="34" font-size="20" font-weight="bold">Ericsson DBHH 1311 → 4G/VoLTE: cable harness</text>
  <text x="40" y="52" font-size="11" fill="#444">All module ends: crimped Dupont 2.54 mm housings. Phone ends: ring/fork lugs under the original terminals.</text>

  <!-- power chain -->
  <rect class="pwr" x="40" y="70" width="150" height="90" rx="6"/>
  <text class="t" x="115" y="96">USB-C charger</text>
  <text class="s" x="115" y="112">power-path</text>
  <text class="s" x="115" y="126">(BQ24074-class)</text>
  <rect class="pwr" x="240" y="70" width="150" height="90" rx="6"/>
  <text class="t" x="315" y="96">1S 18650 pack</text>
  <text class="s" x="315" y="112">cells in parallel</text>
  <rect class="pwr" x="440" y="70" width="140" height="90" rx="6"/>
  <text class="t" x="510" y="96">Boost → 5 V</text>
  <text class="s" x="510" y="112">≥ 2 A peak</text>
  <path class="w v5 thick" d="M190 134H240M390 134H440"/>
  <path class="w gnd thick" d="M190 148H240M390 148H440"/>

  <!-- star point -->
  <rect class="pwr" x="640" y="60" width="300" height="110" rx="6"/>
  <text class="t" x="790" y="82">5V / GND star point</text>
  <text class="s" x="790" y="98">screw terminal block or 2× Wago 221</text>
  <path class="w v5 thick" d="M580 134H925"/>
  <path class="w gnd thick" d="M580 148H925"/>
  <text x="598" y="127" font-size="11" fill="#d62828">5V</text>
  <text x="598" y="165" font-size="11">GND</text>

  <!-- legend -->
  <rect x="1030" y="50" width="430" height="140" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="1045" y="72" font-weight="bold">Wires</text>
  <path class="w v5 thick" d="M1045 90H1085"/><text x="1095" y="94">5V, HAT feed 0.5 mm² (20 AWG)</text>
  <path class="w gnd thick" d="M1045 108H1085"/><text x="1095" y="112">GND, HAT feed 0.5 mm² (20 AWG)</text>
  <path class="w v5" d="M1045 126H1065"/><path class="w gnd" d="M1065 126H1085"/><text x="1095" y="130">5V / GND to ESP32 and SLIC, 0.25 mm² (24 AWG)</text>
  <path class="w sig" d="M1045 144H1085"/><text x="1095" y="148">logic signal, 0.14 mm² (26 AWG)</text>
  <path class="w ring" d="M1045 162H1085"/><text x="1095" y="166">TIP/RING twisted pair (~60 V ring)</text>
  <path class="w aud" d="M1045 180H1085"/><text x="1095" y="184">handset audio, twisted or screened pair</text>

  <!-- power wires from star -->
  <path class="w v5 thick" d="M660 134V220H200V300"/>
  <path class="w gnd thick" d="M680 148V240H240V300"/>
  <path class="w v5" d="M690 134V300"/>
  <path class="w gnd" d="M730 148V300"/>
  <path class="w v5" d="M900 134V240H1130V300"/>
  <path class="w gnd" d="M920 148V220H1170V300"/>
  <g fill="#d62828"><circle cx="660" cy="134" r="4"/><circle cx="690" cy="134" r="4"/><circle cx="900" cy="134" r="4"/></g>
  <g fill="#1b1b1b"><circle cx="680" cy="148" r="4"/><circle cx="730" cy="148" r="4"/><circle cx="920" cy="148" r="4"/></g>
  <text class="c" x="430" y="213">P1  5V</text>
  <text class="c" x="430" y="257">P2  GND</text>
  <text x="696" y="270">P3</text><text x="736" y="270">P4</text>
  <text class="c" x="1040" y="213">P6  GND</text>
  <text class="c" x="1010" y="257">P5  +VPWR (5V)</text>

  <!-- C2 -->
  <path class="w gnd" stroke-width="1.5" d="M200 272H212M228 272H240"/>
  <rect class="cap" x="212" y="263" width="16" height="18" rx="2"/>
  <rect class="extra" x="52" y="258" width="136" height="28" rx="4"/>
  <text class="c" x="120" y="276">C2 ≥ 1000 µF</text>

  <!-- HAT -->
  <rect class="mod" x="60" y="300" width="360" height="220" rx="8"/>
  <text class="t" x="235" y="398">Waveshare A7670E HAT</text>
  <text class="s" x="235" y="416">LTE Cat-1 · VoLTE · nano-SIM</text>
  <text class="s" x="235" y="432">2×20 header</text>
  <rect class="pad" x="194" y="296" width="12" height="10"/><rect class="pad" x="234" y="296" width="12" height="10"/>
  <text class="c" x="196" y="322" font-size="11">2+4</text><text class="c" x="244" y="322" font-size="11">6+14</text>
  <g class="pad"><rect x="414" y="355" width="10" height="10"/><rect x="414" y="395" width="10" height="10"/><rect x="414" y="435" width="10" height="10"/></g>
  <text class="e" x="408" y="364">pin 8</text><text class="e" x="408" y="404">pin 10</text><text class="e" x="408" y="444">pin 7</text>
  <rect x="130" y="520" width="80" height="22" fill="#44546a"/><text class="c" x="170" y="535" fill="#fff" font-size="11">3.5 mm jack</text>
  <!-- antenna -->
  <rect class="pad" x="56" y="335" width="10" height="10"/><text x="72" y="344" font-size="11">ANT</text>
  <path class="w" stroke="#666" d="M56 340H28V210M28 210L16 192M28 210L40 192M28 210V188"/>
  <text x="46" y="206" font-size="11">LTE antenna</text>

  <!-- ESP32 -->
  <rect class="mod" x="560" y="300" width="300" height="220" rx="8"/>
  <text class="t" x="710" y="398">ESP32-DevKitC</text>
  <text class="s" x="710" y="416">state machine · AT commands</text>
  <rect class="pad" x="684" y="296" width="12" height="10"/><rect class="pad" x="724" y="296" width="12" height="10"/>
  <text class="c" x="690" y="322" font-size="11">5V</text><text class="c" x="730" y="322" font-size="11">GND</text>
  <g class="pad"><rect x="556" y="355" width="10" height="10"/><rect x="556" y="395" width="10" height="10"/><rect x="556" y="435" width="10" height="10"/>
  <rect x="854" y="355" width="10" height="10"/><rect x="854" y="395" width="10" height="10"/><rect x="854" y="435" width="10" height="10"/>
  <rect x="624" y="514" width="12" height="10"/><rect x="684" y="514" width="12" height="10"/><rect x="764" y="514" width="12" height="10"/><rect x="824" y="514" width="12" height="10"/></g>
  <text x="572" y="364">GPIO17</text><text x="572" y="404">GPIO16</text><text x="572" y="444">GPIO4</text>
  <text class="e" x="848" y="364">GPIO25</text><text class="e" x="848" y="404">GPIO26</text><text class="e" x="848" y="444">GPIO27</text>
  <text class="c" x="630" y="506" font-size="11">GPIO14</text><text class="c" x="690" y="506" font-size="11">GND</text>
  <text class="c" x="770" y="506" font-size="11">GPIO13</text><text class="c" x="830" y="506" font-size="11">GND</text>

  <!-- signals HAT-ESP -->
  <path class="w sig" d="M424 360H556M424 400H556M424 440H556"/>
  <text class="c" x="490" y="353">S1  TX → RXD</text><text class="c" x="490" y="393">S2  RX ← TXD</text><text class="c" x="490" y="433">S3  PWRKEY</text>

  <!-- SLIC perfboard -->
  <rect class="mod" x="1000" y="300" width="420" height="220" rx="8"/>
  <text class="t" x="1230" y="398">Ag1171 SLIC on perfboard scrap</text>
  <text class="s" x="1230" y="416">14-pin SIL · pin 14 (PD) left open</text>
  <rect class="pad" x="1124" y="296" width="12" height="10"/><rect class="pad" x="1164" y="296" width="12" height="10"/>
  <text class="e" x="1122" y="322" font-size="11">pin 13</text><text x="1180" y="322" font-size="11">pin 12</text>
  <path class="w gnd" stroke-width="1.5" d="M1130 306V342H1142M1158 342H1170V306"/>
  <rect class="cap" x="1142" y="333" width="16" height="18" rx="2"/>
  <rect class="extra" x="1190" y="330" width="170" height="26" rx="4"/>
  <text class="c" x="1275" y="347">C1 ~100 µF (+ 100 nF)</text>
  <g class="pad"><rect x="996" y="355" width="10" height="10"/><rect x="996" y="395" width="10" height="10"/><rect x="996" y="435" width="10" height="10"/>
  <rect x="1174" y="514" width="12" height="10"/><rect x="1214" y="514" width="12" height="10"/></g>
  <text x="1012" y="364">pin 3  F/R</text><text x="1012" y="404">pin 4  RM</text><text x="1012" y="444">pin 5  SHK</text>
  <text class="e" x="1190" y="506" font-size="11">pin 2 TIP</text><text x="1210" y="506" font-size="11">pin 1 RING</text>
  <text x="1290" y="506" font-size="11" fill="#444">(2-way screw terminal)</text>

  <!-- signals ESP-SLIC -->
  <path class="w sig" d="M864 360H996M864 400H996M864 440H996"/>
  <text class="c" x="930" y="353">S4  F/R</text><text class="c" x="930" y="393">S5  RM</text><text class="c" x="930" y="433">S6  SHK</text>

  <!-- audio -->
  <rect class="extra" x="40" y="578" width="190" height="44" rx="4"/>
  <text class="c" x="135" y="596">Carbon-mic bias</text>
  <text class="s" x="135" y="612">R to 5 V + DC-block cap</text>
  <text class="e" x="148" y="566">A1</text><text x="240" y="553">A2</text>
  <text x="322" y="600" font-size="11" fill="#444">TRRS pigtail</text>
  <rect class="ph" x="50" y="650" width="360" height="130" rx="8"/>
  <text class="t" x="220" y="676">Handset</text>
  <rect x="70" y="700" width="120" height="56" rx="6" fill="#fff" stroke="#6b5b3a"/>
  <text class="c" x="130" y="726" font-weight="bold">MIC</text><text class="s" x="130" y="742">carbon capsule</text>
  <rect x="250" y="700" width="120" height="56" rx="6" fill="#fff" stroke="#6b5b3a"/>
  <text class="c" x="310" y="726" font-weight="bold">SPK</text><text class="s" x="310" y="742">receiver</text>

  <path class="w aud" d="M155 542V578M130 622V700"/>
  <path class="w aud" d="M185 542V560H310V700"/>
  <!-- hook + dial -->
  <path class="w sig" d="M630 524V660M770 524V660"/>
  <path class="w gnd" d="M690 524V660M830 524V660"/>
  <text class="e" x="624" y="596">H1</text><text x="696" y="596">H2</text>
  <text class="e" x="764" y="596">D1</text><text x="836" y="596">D2</text>
  <rect class="ph" x="600" y="660" width="120" height="80" rx="8"/>
  <text class="t" x="660" y="696">Hook switch</text><text class="s" x="660" y="714">closes to GND</text>
  <rect class="ph" x="740" y="660" width="120" height="80" rx="8"/>
  <text class="t" x="800" y="696">Rotary dial</text><text class="s" x="800" y="714">pulse contacts</text>

  <!-- line / bells -->
  <path class="w ring" d="M1180 524V620M1220 524V620M1180 670V710M1220 670V710M1180 760V800M1220 760V800"/>
  <text x="1236" y="576">T1 / T2</text>
  <rect class="ph" x="1110" y="620" width="180" height="50" rx="8"/>
  <text class="t" x="1200" y="650">Line terminals</text>
  <rect class="ph" x="1110" y="710" width="180" height="50" rx="8"/>
  <text class="t" x="1200" y="732">1 µF cap block</text><text class="s" x="1200" y="750">ringer DC-block (original)</text>
  <rect class="ph" x="1110" y="800" width="180" height="56" rx="8"/>
  <text class="t" x="1200" y="824">Twin-gong bells</text><text class="s" x="1200" y="842">+ ringer coil</text>

  <!-- key -->
  <rect class="mod" x="50" y="830" width="22" height="14" rx="3"/><text x="80" y="842">module</text>
  <rect class="pwr" x="150" y="830" width="22" height="14" rx="3"/><text x="180" y="842">power</text>
  <rect class="ph" x="245" y="830" width="22" height="14" rx="3"/><text x="275" y="842">original phone part</text>
  <rect class="extra" x="410" y="830" width="22" height="14" rx="3"/><text x="440" y="842">extra part you add</text>
  <text x="50" y="876" font-size="11" fill="#444">Keep T1/T2 away from A1/A2. Keep audio and the mic bias away from the antenna. Wire list: README.md in this folder.</text>
</svg>
